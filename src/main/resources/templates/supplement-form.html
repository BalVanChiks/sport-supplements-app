<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма добавки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 25px; text-align: center; }
        .back-link {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-weight: 600;
            color: #555;
        }
        input, select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 15px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Добавить добавку</h1>
        <a href="/supplements" class="back-link">← Вернуться к списку</a>

        <form th:action="@{/supplements/save}" method="post">
            <label>Тип добавки:
                <select name="type" required>
                    <option value="Kreatin">Креатин</option>
                    <option value="Protein">Протеин</option>
                </select>
            </label>

            <label>Название:
                <input type="text" name="name" required placeholder="Например: Creatine Pro">
            </label>

            <label>Цена (₽):
                <input type="number" step="0.01" name="price" required placeholder="1500">
            </label>

            <label>Вес упаковки (г):
                <input type="number" step="0.01" name="packageWeight" required placeholder="500">
            </label>

            <label>Производитель:
                <select name="manufacturerId" required>
                    <option th:each="m : ${manufacturers}" th:value="${m.id}" th:text="${m.name}"></option>
                </select>
            </label>

            <label>Подтип (monogidrat / gidrohlorid / casein / rastiteln):
                <input type="text" name="subtype" required placeholder="monogidrat">
            </label>

            <label>Размер порции (г):
                <input type="number" step="0.01" name="portionSize" required placeholder="5">
            </label>

            <button type="submit">💾 Сохранить</button>
        </form>
    </div>
</body>
</html>
